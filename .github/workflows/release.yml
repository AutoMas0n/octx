name: CI/CD

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 0 * * 0'  # weekly Sunday midnight

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo check
      - run: cargo test
      - run: cargo clippy -- -D warnings
      - run: cargo fmt --check

  audit:
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - arm-unknown-linux-gnueabihf
          - aarch64-linux-android
          - armv7-linux-androideabi
          - x86_64-linux-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          case ${{ matrix.target }} in
            x86_64-unknown-linux-musl)
              sudo apt-get install -y musl-tools
              ;;
            arm-unknown-linux-gnueabihf)
              sudo apt-get install -y gcc-arm-linux-gnueabihf lld
              echo "CC_arm_unknown_linux_gnueabihf=arm-linux-gnueabihf-gcc" >> "$GITHUB_ENV"
              echo "AR_arm_unknown_linux_gnueabihf=arm-linux-gnueabihf-ar" >> "$GITHUB_ENV"
              echo "CARGO_TARGET_ARM_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc" >> "$GITHUB_ENV"
              ;;
            aarch64-unknown-linux-musl)
              sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools lld
              echo "CC_aarch64_unknown_linux_musl=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
              echo "AR_aarch64_unknown_linux_musl=aarch64-linux-gnu-ar" >> "$GITHUB_ENV"
              echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
              ;;
            *-linux-android*)
              # Android links bionic, not musl: a musl-static binary cannot
              # resolve DNS there (no /etc/resolv.conf). Use the NDK's clang,
              # which is preinstalled on the runner image.
              NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
              if [ -z "$NDK" ]; then
                NDK=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -1)
              fi
              if [ -z "$NDK" ]; then
                echo "Android NDK not found on this runner" >&2
                exit 1
              fi
              BIN="${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin"
              case ${{ matrix.target }} in
                aarch64-linux-android)   CLANG_TRIPLE=aarch64-linux-android21 ;;
                armv7-linux-androideabi) CLANG_TRIPLE=armv7a-linux-androideabi21 ;;
                x86_64-linux-android)    CLANG_TRIPLE=x86_64-linux-android21 ;;
              esac
              VAR=$(echo "${{ matrix.target }}" | tr '-' '_')
              VAR_UPPER=$(echo "$VAR" | tr '[:lower:]' '[:upper:]')
              # cc-rs wants CC_<target> lowercased; cargo wants the upper form.
              echo "CC_${VAR}=${BIN}/${CLANG_TRIPLE}-clang" >> "$GITHUB_ENV"
              echo "AR_${VAR}=${BIN}/llvm-ar" >> "$GITHUB_ENV"
              echo "CARGO_TARGET_${VAR_UPPER}_LINKER=${BIN}/${CLANG_TRIPLE}-clang" >> "$GITHUB_ENV"
              ;;
          esac
      - name: Build head
        run: cargo build --target ${{ matrix.target }} --release
      - name: Build arms
        run: |
          for arm in octx-fmt octx-parse octx-deploy octx-agent octx-harness; do
            cargo build -p "$arm" --target ${{ matrix.target }} --release
          done
      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          # Head
          cp "target/${{ matrix.target }}/release/octx" octx
          gzip -c octx > "artifacts/octx-${{ matrix.target }}.gz"
          sha256sum "artifacts/octx-${{ matrix.target }}.gz" | cut -d' ' -f1 > "artifacts/octx-${{ matrix.target }}.gz.sha256"
          # Arms
          for arm in fmt parse deploy agent harness; do
            cp "target/${{ matrix.target }}/release/$arm" "$arm"
            gzip -c "$arm" > "artifacts/$arm-${{ matrix.target }}.gz"
            sha256sum "artifacts/$arm-${{ matrix.target }}.gz" | cut -d' ' -f1 > "artifacts/$arm-${{ matrix.target }}.gz.sha256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: artifacts/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Build storage archive
        run: tar -czf storage.tar.gz -C storage .
      - name: Collect arm skill files
        run: |
          for d in arms/*/; do
            name=$(basename "$d")
            if [ -f "$d/skill.md" ]; then
              cp "$d/skill.md" "${name}.skill.md"
            fi
          done
      - name: Generate registry-index.json
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          STORAGE_SHA=$(sha256sum storage.tar.gz | cut -d' ' -f1)
          BASE_URL="https://github.com/AutoMas0n/octx/releases/download/v${VERSION}"

          # Discover binaries/targets from the built artifacts so this can never
          # drift out of sync with the release matrix again.
          SHAS=$(
            for f in artifacts/artifacts-*/*.gz.sha256; do
              name=$(basename "$f" .gz.sha256)   # e.g. fmt-aarch64-linux-android
              bin=${name%%-*}                    # fmt
              target=${name#*-}                  # aarch64-linux-android
              jq -n --arg b "$bin" --arg t "$target" --arg s "$(cat "$f")" \
                '{bin: $b, target: $t, sha: $s}'
            done | jq -s 'group_by(.bin)
                          | map({key: .[0].bin, value: (map({key: .target, value: .sha}) | from_entries)})
                          | from_entries'
          )

          jq -n \
            --arg version "$VERSION" \
            --arg ts "$TIMESTAMP" \
            --arg base "$BASE_URL" \
            --arg storage_sha "$STORAGE_SHA" \
            --argjson skills "$(for d in arms/*/; do if [ -f "$d/skill.md" ]; then basename "$d"; fi; done | jq -R -s 'split("\n") | map(select(. != ""))')" \
            --argjson shas "$SHAS" \
            '
            def downloads($bin):
              $shas[$bin]
              | to_entries
              | map({ key: .key,
                      value: { url: ($base + "/" + $bin + "-" + .key + ".gz"),
                               sha256: .value } })
              | from_entries;

            def arm_descriptions:
              { fmt: "Opinionated code formatter",
                parse: "File parser",
                deploy: "Deployment tool",
                agent: "Headless ACP agent runner with a tool plane and script socket",
                harness: "Resolves harness definitions and dispatches them to the agent arm" };

            {
              registry_version: 1,
              updated: $ts,
              head: {
                version: $version,
                etag: ("\"" + ($shas.octx | to_entries | sort_by(.key) | .[0].value | .[0:16]) + "\""),
                downloads: downloads("octx")
              },
              storage: {
                version: $version,
                etag: ("\"" + ($storage_sha | .[0:16]) + "\""),
                download: { url: ($base + "/storage.tar.gz"), sha256: $storage_sha }
              },
              arms: (
                $shas
                | to_entries
                | map(select(.key != "octx"))
                | map(.key as $k
                      | { key: $k,
                          value: { description: ((arm_descriptions)[$k] // "octx arm"),
                                   repository: "https://github.com/AutoMas0n/octx",
                                   skill_url: (if ($skills | index($k)) then ($base + "/" + $k + ".skill.md") else null end),
                                   versions: { ($version): { downloads: downloads($k) } } } })
                | from_entries
              )
            }' > registry-index.json

          echo "Generated registry-index.json:"
          cat registry-index.json
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/artifacts-*/*.gz
            artifacts/artifacts-*/*.sha256
            *.skill.md
            registry-index.json
            storage.tar.gz
          body: |
            ## octx ${{ github.ref_name }}

            See [registry-index.json](/${{ github.ref_name }}/registry-index.json) for artifact manifest.