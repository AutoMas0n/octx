[workspace]
members = ["arms/*", "crates/*"]
resolver = "2"

[workspace.package]
version = "0.4.1"
edition = "2024"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
octx-creds = { path = "crates/octx-creds" }

[package]
name = "octx"
version.workspace = true
edition.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
semver = "1.0"
dirs = "6"
chrono = "0.4"
hex = "0.4"
flate2 = "1"
tar = "0.4"
fs2 = "0.4"
toml = "0.8"
rpassword = "7"
octx-creds.workspace = true

[profile.dev]
# Keep the debug target dir bounded. Full debuginfo + incremental caches
# accumulate ~5G+ on this workspace and are never garbage-collected.
incremental = false
debug = "line-tables-only"

[profile.release]
opt-level = "z"
lto = true
strip = "symbols"
codegen-units = 1
panic = "abort"