[package]
name = "octx"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
semver = "1.0"
dirs = "6"
chrono = "0.4"
hex = "0.4"
fs2 = "0.4"
toml = "0.8"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"

[profile.release]
lto = true
strip = "symbols"
codegen-units = 1