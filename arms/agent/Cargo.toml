[package]
name = "octx-agent"
version.workspace = true
edition.workspace = true

[[bin]]
name = "agent"
path = "src/main.rs"

[dependencies]
clap.workspace = true
anyhow.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "process", "io-util", "sync", "time", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
agent-client-protocol = { version = "3", features = ["process"] }

[dev-dependencies]
tempfile = "3"
